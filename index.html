<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetSure Service Notice</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <div class="card">

            <div class="icon">⚠️</div>

            <h1>CyberFastLinkConverge Internet</h1>

            <p class="label">SERVICE NOTICE</p>

            <h2>Your Internet Account Requires Attention</h2>

            <p class="message">
                Your account requires verification.
                Please review your account information to avoid
                possible service interruption.
            </p>

            <button onclick="goToLogin()">
                Review My Account
            </button>

            <p class="small">
                Converge Security Center
            </p>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
