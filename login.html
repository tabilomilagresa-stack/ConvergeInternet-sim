<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NetSure Account Verification</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <div class="card">

            <div class="icon">🔐</div>

            <h1>NetSure</h1>

            <p class="label">ACCOUNT VERIFICATION</p>

            <h2>Verify Your Account</h2>

            <p class="message">
                Enter your information to continue.
            </p>

            <form onsubmit="showSimulation(event)">

                <input
                    type="text"
                    placeholder="Name"
                    autocomplete="off"
                    required
                >

                <input
                    type="password"
                    placeholder="Password"
                    autocomplete="off"
                    required
                >

                <button type="submit">
                    Continue
                </button>

            </form>

            <!-- <p class="small">
                Cybersecurity awareness simulation
            </p> -->

        </div>

    </main>

    <script>
        function showSimulation(event) {
            event.preventDefault();

            window.location.href = "reveal.html";
        }
    </script>

</body>
</html>
